# Server-local presentation. Restart Paper after editing. No credentials belong in this file.
# Tokens are plain Component substitutions, not MiniMessage: {role}, {ign}, {real_name}.
# {real_name} includes its optional leading space and parentheses; {role} includes a trailing space.
colors:
  ign: '#FFFFFF'
  real-name: '#AAAAAA'
  member: '#22C55E'
  non-member: '#AAAAAA'
  administrator: '#A3E635'
display:
  join:
    enabled: true
    format: '[{marker}] {ign}{real_name}'
    color: '#FFFFFF'
    marker-color: '#55FF55'
  quit:
    enabled: true
    format: '[{marker}] {ign}{real_name}'
    color: '#FFFFFF'
    marker-color: '#FF5555'
  transfer:
    enabled: true
    format: '[{marker}] {ign}{real_name}'
    color: '#FFFFFF'
    marker-color: '#FFAA00'
  chat:
    enabled: true
    format: '{role}{ign}{real_name}: {message}'
    color: '#AAAAAA'
  tab:
    enabled: true
    format: '{role}{ign}{real_name}'
    color: '#FFFFFF'
  nameplate:
    enabled: true
    # Exactly one {ign}; color sets the vanilla name color (nearest Minecraft palette color).
    format: '{ign}{real_name}'
    color: '#FFFFFF'

help:
  # Only installed commands passing their real Bukkit permission check are listed.
  # An optional permission adds a further check. The two public Velocity routes are explicit exceptions.
  entries:
    - command: '/passport help'
      description: '인증 상태와 Passport 명령'
      proxy: true
    - command: '/서버'
      description: '접속 가능한 서버 선택'
      proxy: true
    - command: '/tpa'
      description: '다른 플레이어에게 이동 요청'
    - command: '/tpaccept'
      description: '받은 이동 요청 수락'
    - command: '/home'
      description: '개인 리스폰 지점이나 월드 스폰으로 이동'
    - command: '/back'
      description: '마지막 사망 지점으로 이동'
    - command: '/lobby'
      description: '로비 명령 안내'
    - command: '/lobby fly'
      description: '로비 비행 전환'
      permission: 'overworld.lobby.fly'
    - command: '/claim'
      description: '평화 서버의 토지 보호'
    - command: '/trust'
      description: '보호 구역에 플레이어 초대'
    - command: '/untrust'
      description: '보호 구역 권한 해제'
    - command: '/gamemode'
      description: '게임 모드 변경'
      permission: 'minecraft.command.gamemode'
    - command: '/tp'
      description: '플레이어 순간 이동'
      permission: 'minecraft.command.teleport'
    - command: '/time'
      description: '월드 시간 변경'
      permission: 'minecraft.command.time'
    - command: '/weather'
      description: '월드 날씨 변경'
      permission: 'minecraft.command.weather'
    - command: '/lp editor'
      description: 'LuckPerms 권한 편집기'
      permission: 'luckperms.editor'
